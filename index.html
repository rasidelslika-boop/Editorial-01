<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%232A0B12'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23B08D57' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23B08D57'/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="RSFASHIONPHOTO — the AI fashion editorial studio. Cast the muse, scout the set, and develop high-end editorial plates." />
    <title>RSFASHIONPHOTO — AI Fashion Editorial Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Manrope:wght@400..800&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      /* Boot guard — shows the real reason when the studio genuinely fails to
         mount, and stays out of the way otherwise.

         Rules of discernment:
         · Preview-host infrastructure noise (live-reload WebSockets, injected
           scripts) is ignored — it must never hijack a working studio.
         · Errors that fire AFTER React has mounted are ignored — the app has
           its own boundary for those.
         · Only pre-mount script errors and failed asset loads raise the panel.
         The panel is an overlay, so it can never destroy React's DOM, and it
         dismisses itself the moment the app mounts. */
      (function () {
        var shown = false;
        var NOISE = /websocket|ws:\/\//i;
        var root = document.getElementById("root");

        function appMounted() {
          return !!(root && root.childElementCount > 0);
        }

        function dismiss() {
          var panel = document.getElementById("boot-panel");
          if (panel) panel.remove();
          shown = false;
        }

        function showPanel(title, detail) {
          if (shown) return;
          shown = true;

          var panel = document.createElement("div");
          panel.id = "boot-panel";
          panel.style.cssText =
            "position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;" +
            "background:rgba(18,17,20,0.96);color:#efedea;font-family:Georgia,'Times New Roman',serif;padding:24px";

          var card = document.createElement("div");
          card.style.cssText =
            "max-width:460px;width:100%;border:1px solid #3a3733;padding:36px 32px;text-align:center;" +
            "background:#161419;box-shadow:0 40px 90px -30px rgba(0,0,0,0.8)";

          var kicker = document.createElement("p");
          kicker.textContent = "RSFASHIONPHOTO · Darkroom";
          kicker.style.cssText =
            "font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.3em;color:#b08d57;text-transform:uppercase;margin:0 0 14px";

          var h1 = document.createElement("h1");
          h1.textContent = title;
          h1.style.cssText = "font-style:italic;font-weight:600;font-size:27px;margin:0 0 12px";

          var body = document.createElement("p");
          body.textContent = detail;
          body.style.cssText =
            "font-family:'Space Mono',monospace;font-size:11px;line-height:1.75;color:#9a958e;margin:0 0 22px;word-break:break-word";

          var hint = document.createElement("p");
          hint.textContent = "Try a hard refresh — ⌘⇧R (Mac) or Ctrl⇧R (Windows).";
          hint.style.cssText = "font-family:'Space Mono',monospace;font-size:10px;color:#6b6761;margin:0 0 22px";

          var row = document.createElement("div");
          row.style.cssText = "display:flex;gap:10px;justify-content:center;flex-wrap:wrap";

          var reload = document.createElement("button");
          reload.textContent = "Reload the studio";
          reload.style.cssText =
            "font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;" +
            "background:#b08d57;color:#121114;border:1px solid #b08d57;padding:10px 18px;cursor:pointer";
          reload.onclick = function () {
            location.reload();
          };

          var wave = document.createElement("button");
          wave.textContent = "Dismiss";
          wave.style.cssText =
            "font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;" +
            "background:transparent;color:#9a958e;border:1px solid #3a3733;padding:10px 18px;cursor:pointer";
          wave.onclick = dismiss;

          row.appendChild(reload);
          row.appendChild(wave);
          card.appendChild(kicker);
          card.appendChild(h1);
          card.appendChild(body);
          card.appendChild(hint);
          card.appendChild(row);
          panel.appendChild(card);
          document.body.appendChild(panel);
        }

        /* The moment the studio mounts, any boot panel is obsolete. */
        if (root && "MutationObserver" in window) {
          new MutationObserver(function () {
            if (appMounted()) dismiss();
          }).observe(root, { childList: true });
        }

        window.addEventListener(
          "error",
          function (e) {
            var msg = (e && e.message) || (e && e.error && e.error.message) || "";

            /* A failed <script>/<link> load is a real boot failure. */
            var t = e && e.target;
            if (t && t !== window && (t.tagName === "SCRIPT" || t.tagName === "LINK")) {
              showPanel("The studio hit a snag", "An asset failed to load: " + (t.src || t.href || "unknown") + ". A hard refresh usually clears a stale cache.");
              return;
            }

            /* Host infrastructure (WebSocket live-reload etc.) — never ours. */
            if (NOISE.test(msg)) return;

            /* The app is already alive — let its own boundary handle it. */
            if (appMounted()) return;

            showPanel("The studio hit a snag", msg || "Something failed while the app was loading.");
          },
          true
        );

        window.addEventListener("unhandledrejection", function (e) {
          var msg = e && e.reason ? e.reason.message || String(e.reason) : "";
          if (NOISE.test(msg) || appMounted()) return;
          showPanel("The studio hit a snag", msg || "A startup request failed.");
        });

        /* If nothing has rendered after a while, say so — without killing the app. */
        setTimeout(function () {
          if (!appMounted() && !shown) {
            showPanel("Still warming up…", "The studio is taking longer than usual to load. A hard refresh (⌘⇧R) usually fixes a stale cache.");
          }
        }, 9000);

        /* Compatible hook for the React boundary in main.tsx. */
        window.__rsBootError = function (msg) {
          if (!appMounted()) showPanel("The studio hit a snag", msg || "A render error occurred.");
        };
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
